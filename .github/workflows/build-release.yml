name: Build Xray LuCI

on:
  push:
    tags: ["*"]
  workflow_dispatch:

env:
  PACKAGE_NAME: luci-app-xray
  SDK_URL: https://downloads.openwrt.org/releases/25.12.2/targets/mediatek/filogic
  SDK_PATTERN: openwrt-sdk-25.12.2-mediatek-filogic

jobs:
  build:
    name: Build aarch64_cortex-a53
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gettext libncurses5-dev xsltproc zstd wget

      - name: Download and extract SDK
        run: |
          set -euo pipefail
          mkdir -p $HOME/sdk-cache $HOME/sdk
          cd $HOME/sdk-cache

          echo "=== 获取 sha256sums ==="
          curl -fsSL "$SDK_URL/sha256sums" -o sha256sums
          echo "--- 匹配行 ---"
          grep "$SDK_PATTERN" sha256sums || { echo "::error::SDK_PATTERN 未匹配"; exit 1; }

          SDK_FILE=$(grep "$SDK_PATTERN" sha256sums | head -1 | awk '{print $2}' | sed 's/^\*//')
          if [ -z "$SDK_FILE" ]; then
            echo "::error::SDK_FILE 为空"
            exit 1
          fi
          echo "SDK_FILE=$SDK_FILE"

          if [ ! -s "$SDK_FILE" ]; then
            echo "=== 下载 ==="
            wget -q --show-progress "$SDK_URL/$SDK_FILE"
          fi

          ls -lh "$SDK_FILE"
          echo "=== 校验 ==="
          grep "$SDK_PATTERN" sha256sums > check.txt
          cat check.txt
          sha256sum -c check.txt

          echo "=== 解压 ==="
          tar -C $HOME/sdk --strip=1 -I zstd -xvf "$SDK_FILE"
          echo "=== 解压结果 ==="
          ls $HOME/sdk | head -20

      - name: Setup feeds
        run: |
          set -euo pipefail
          cd $HOME/sdk
          cp feeds.conf.default feeds.conf
          sed -i 's#git.openwrt.org/openwrt/openwrt#github.com/openwrt/openwrt#' feeds.conf
          sed -i 's#git.openwrt.org/feed/packages#github.com/openwrt/packages#' feeds.conf
          sed -i 's#git.openwrt.org/project/luci#github.com/openwrt/luci#' feeds.conf
          sed -i 's#git.openwrt.org/feed/routing#github.com/openwrt/routing#' feeds.conf
          sed -i 's#git.openwrt.org/feed/telephony#github.com/openwrt/telephony#' feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Link source and configure
        run: |
          set -euo pipefail
          cd $HOME/sdk
          ln -sfn $GITHUB_WORKSPACE package/luci-app-xray
          echo "CONFIG_PACKAGE_luci-app-xray=y" >> .config
          make defconfig
          grep -i xray .config || true

      - name: Build
        run: |
          set -euo pipefail
          cd $HOME/sdk
          make package/luci-app-xray/compile -j$(nproc) V=s

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p $GITHUB_WORKSPACE/out
          find $HOME/sdk/bin -type f \( -name "*luci-app-xray*.apk" -o -name "*luci-app-xray*.ipk" \) \
            -exec cp -v {} $GITHUB_WORKSPACE/out/ \;
          echo "=== 产物 ==="
          ls -lh $GITHUB_WORKSPACE/out/
          [ "$(ls -A $GITHUB_WORKSPACE/out)" ] || { echo "::error::没有产物"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-aarch64_cortex-a53
          path: $GITHUB_WORKSPACE/out/*
          if-no-files-found: error
          retention-days: 30
