name: Build Xray LuCI

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  PACKAGE_NAME: luci-app-xray

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "25.12"
            arch: aarch64_cortex-a53
            sdk_url: https://downloads.openwrt.org/releases/25.12.2/targets/mediatek/filogic
            sdk_name: -sdk-25.12.2-mediatek-filogic_

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SDK and feeds
        uses: actions/cache@v4
        with:
          path: |
            ~/sdk-cache
            ~/.ccache
          key: openwrt-sdk-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            openwrt-sdk-${{ matrix.arch }}-

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gettext libncurses5-dev xsltproc zstd

      - name: Download SDK
        run: |
          mkdir -p ~/sdk-cache
          cd ~/sdk-cache
          FILE=$(curl -s "${{ matrix.sdk_url }}/sha256sums" | grep "${{ matrix.sdk_name }}" | cut -d' ' -f2 | sed 's/*//g')
          echo "SDK: $FILE"
          if [ ! -f "$FILE" ]; then
            wget -q "${{ matrix.sdk_url }}/$FILE"
          fi
          echo "SDK_FILE=$FILE" >> $GITHUB_ENV

      - name: Extract SDK
        run: |
          mkdir -p $HOME/sdk
          tar -C $HOME/sdk --strip=1 -I zstd -xf ~/sdk-cache/${{ env.SDK_FILE }}
          echo "SDK_HOME=$HOME/sdk" >> $GITHUB_ENV

      - name: Setup feeds
        run: |
          cd $SDK_HOME
          cp feeds.conf.default feeds.conf
          sed -i 's#git.openwrt.org/openwrt/openwrt#github.com/openwrt/openwrt#' feeds.conf
          sed -i 's#git.openwrt.org/feed/packages#github.com/openwrt/packages#' feeds.conf
          sed -i 's#git.openwrt.org/project/luci#github.com/openwrt/luci#' feeds.conf
          sed -i 's#git.openwrt.org/feed/routing#github.com/openwrt/routing#' feeds.conf
          sed -i 's#git.openwrt.org/feed/telephony#github.com/openwrt/telephony#' feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Link package source
        run: |
          cd $SDK_HOME
          ln -sfn $GITHUB_WORKSPACE package/luci-app-xray

      - name: Configure
        run: |
          cd $SDK_HOME
          echo "CONFIG_PACKAGE_luci-app-xray=y" >> .config
          make defconfig

      - name: Build
        run: |
          cd $SDK_HOME
          make package/luci-app-xray/compile -j$(nproc) V=s

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/out
          find $SDK_HOME/bin -type f \( -name "*${PACKAGE_NAME}*.apk" -o -name "*${PACKAGE_NAME}*.ipk" \) \
            -exec cp {} $GITHUB_WORKSPACE/out/ \;
          echo "=== 产物 ==="
          ls -lh $GITHUB_WORKSPACE/out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-${{ matrix.arch }}
          path: $GITHUB_WORKSPACE/out/*
          if-no-files-found: error
          retention-days: 30
